[project]
name = "pithtrain"
version = "0.1.1"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "deep-gemm",
    "flash-attn-4[cu13]>=4.0.0b7",
    "tilelang",
    "torch>=2.10.0",
    # Non-Python-native ablation arm: MoE experts + attention/RMSNorm/RoPE/SwiGLU
    # route through TransformerEngine. Pinned to 2.12.0 (commit 5671fd36) — the
    # version the paper's Megatron eval used, which still carries the CUTLASS
    # grouped-GEMM path (removed in 2.17). This is a source build; the setup must
    # export NVTE_FRAMEWORK=pytorch, NVTE_WITH_NCCL_EP=0, NVTE_CUDA_ARCHS="90;100"
    # (also wired into [tool.uv.extra-build-variables] below).
    "transformer-engine @ git+https://github.com/NVIDIA/TransformerEngine.git@5671fd36",
    "transformers",
    "wandb",
    "zstandard",
]

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools.packages.find]
include = ["pithtrain*"]

[tool.uv]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", branch = "main" }
torch = { index = "torch-cu130" }

[tool.uv.extra-build-dependencies]
deep-gemm = [
    "torch>=2.10.0",
    "packaging",
    "setuptools",
    "wheel",
]
# TransformerEngine 2.12 builds its CUDA/C++ extensions from source.
transformer-engine = [
    "torch>=2.10.0",
    "packaging",
    "setuptools",
    "wheel",
    "pybind11",
    "cmake",
    "ninja",
]
[tool.uv.extra-build-variables]
deep-gemm = { DG_FORCE_BUILD = "1", DG_USE_LOCAL_VERSION = "0" }
# Build only the PyTorch framework, skip the NCCL-based EP comm, target Hopper
# (CUTLASS grouped GEMM) and Blackwell.
transformer-engine = { NVTE_FRAMEWORK = "pytorch", NVTE_WITH_NCCL_EP = "0", NVTE_CUDA_ARCHS = "90;100" }

[tool.mypy]
follow_imports = "skip"
ignore_errors = false
ignore_missing_imports = true
show_column_numbers = true
show_error_context = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["E501", "E731"]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["pithtrain"]
