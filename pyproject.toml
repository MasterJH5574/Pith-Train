[project]
name = "pithtrain"
version = "0.1.1"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "deep-gemm",
    "flash-attn-4[cu13]>=4.0.0b12",
    "torch>=2.10.0",
    "transformers",
    "wandb",
    "zstandard",
]

# DeepEP v2 itself is installed post-`uv sync` by `scripts/install_deepep.sh`
# (handles the libnccl.so SONAME symlink and multi-arch C++ build that uv sync
# can't do alone). The NCCL override below is so `uv sync` already produces the
# >=2.30.4 NCCL DeepEP needs at runtime — torch 2.12 otherwise pins it to 2.29.7.

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools.packages.find]
include = ["pithtrain*"]

[tool.uv]
# DeepEP v2 needs NCCL >= 2.30.4 at runtime; torch 2.12 hard-pins
# nvidia-nccl-cu13 == 2.29.7. NCCL is ABI-backward-compatible so torch keeps
# working with the newer wheel.
override-dependencies = ["nvidia-nccl-cu13>=2.30.4"]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", branch = "main" }
torch = { index = "torch-cu130" }

[tool.uv.extra-build-dependencies]
deep-gemm = [
    "torch>=2.10.0",
    "packaging",
    "setuptools",
    "wheel",
]
[tool.uv.extra-build-variables]
deep-gemm = { DG_FORCE_BUILD = "1", DG_USE_LOCAL_VERSION = "0" }

[tool.mypy]
follow_imports = "skip"
ignore_errors = false
ignore_missing_imports = true
show_column_numbers = true
show_error_context = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["E501", "E731"]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["pithtrain"]
